-- Panel de recursos de Willy Linux (conky). Se muestra arriba a la derecha.
-- Se oculta/muestra con Ctrl+Alt+M o con "Monitor (mostrar/ocultar)" en el menu.
conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 0,
    cpu_avg_samples = 4,
    net_avg_samples = 2,
    default_color = 'd8e6e0',
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    use_xft = true,
    font = 'DejaVu Sans:size=9',
    gap_x = 14,
    gap_y = 38,
    minimum_width = 200,
    maximum_width = 240,
    no_buffers = true,
    double_buffer = true,
    out_to_console = false,
    out_to_x = true,
    own_window = true,
    own_window_type = 'utility',
    own_window_class = 'WillyMonitor',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 196,
    own_window_colour = '#0a1517',
    override_utf8_locale = true,
    update_interval = 2,
    uppercase = false,
}

conky.text = [[
${color #8fbfb0}${font DejaVu Sans:size=10}WILLY LINUX${font}${color}
${time %a %d/%m/%Y}  ${time %H:%M}${alignr}up ${uptime}

${color #8fbfb0}CPU${color}  ${cpu cpu0}%${alignr}${cpubar cpu4 7,84}
${color #8fbfb0}RAM${color}  ${memperc}%${alignr}${mbar 7,84}
  ${mem}/${memmax}
${color #8fbfb0}Swap${color}  ${swapperc}%${alignr}${swapbar 7,84}
  ${swap}/${swapmax}

${color #8fbfb0}Disco${color}  ${diskio}
${color #8fbfb0}Red${color}  ${execi 15 willy-trafico}

${color #8fbfb0}MAS MEMORIA${color}
${top_mem name 1}  ${top_mem mem_res 1}
${top_mem name 2}  ${top_mem mem_res 2}
${top_mem name 3}  ${top_mem mem_res 3}
${color #8fbfb0}MAS CPU${color}
${top name 1}  ${top cpu 1}%
${top name 2}  ${top cpu 2}%
]]
