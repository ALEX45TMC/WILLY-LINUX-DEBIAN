[Autologin]
; En la sesion live entra directo; en un equipo instalado no existe el usuario
; live, asi que SDDM muestra la pantalla de inicio de sesion normal.
;
; En Debian trixie plasma-workspace solo trae dos sesiones:
;   /usr/share/wayland-sessions/plasma.desktop   (Wayland)
;   /usr/share/xsessions/plasmax11.desktop       (X11)
; Se fija X11 porque es la que arranca en cualquier equipo: VirtualBox sin
; aceleracion 3D, graficas antiguas o drivers sin OpenGL. Si en un equipo actual
; se quiere Wayland, cambiar esta linea por Session=plasma.desktop.
Session=plasmax11.desktop
User=live

[General]
DisplayServer=x11

[Theme]
Current=breeze
