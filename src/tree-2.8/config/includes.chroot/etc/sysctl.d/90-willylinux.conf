vm.swappiness=10
vm.vfs_cache_pressure=150

# Debian guarda /usr/bin/ping con la capability cap_net_raw en el xattr del
# archivo, y al empaquetar el chroot en squashfs esa capability se pierde: en el
# USB live el ping de cualquier usuario responde "missing cap_net_raw+p
# capability or setuid" y nobody puede probar su propia red. Con este rango
# cualquier usuario abre el socket ICMP sin privilegios, que es como lo arregla
# Debian en el sistema instalado. Vale igual en vivo y en disco.
net.ipv4.ping_group_range=0 2147483647
